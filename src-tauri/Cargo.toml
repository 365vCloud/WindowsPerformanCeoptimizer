[package]
name = "wpo-app"
version = "2.1.0"
description = "Windows Performance Optimizer v2 (Tauri)"
authors = ["365vCloud"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wpo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
trash = "5"
sysinfo = "0.30"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[[bin]]
name = "wpo-app"
path = "src/main.rs"
